version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react:
        patterns:
          - react
          - react-dom
      tailwind:
        patterns:
          - tailwindcss
          - '@tailwindcss/postcss'
    ignore:
      # Major upgrades need a deliberate migration, not an automated merge.
      - dependency-name: '*'
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
